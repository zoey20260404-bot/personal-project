# 应用配置：一切可变皆有默认——模型渠道、Prompt、执行流程、存储均可配置
# 敏感信息通过环境变量注入：LLM_API_KEY / EMBEDDING_API_KEY / JWT_SECRET
server:
  port: 8080

jwt:
  secret: ""        # JWT 签名密钥，务必用环境变量 JWT_SECRET 注入
  expire_hours: 72  # Token 有效期（小时）

# 日志配置：级别/格式/输出位置可调
log:
  level: "info"        # debug / info / warn / error
  format: "json"       # text / json
  output: "both"       # stdout / file / both
  path: "logs/app.log" # 日志文件路径（output 含 file 时生效）

# 模型渠道表：OpenAI 兼容协议，可任意扩展（智谱/硅基流动/DeepSeek/本地 Ollama 等）
# 约定渠道名：chat（文本）、vision（视觉，密钥为空时复用 chat）、embedding（向量化）
models:
  chat: # 智谱 GLM-4-Flash（永久免费，https://open.bigmodel.cn 注册）
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    model: "glm-4-flash"
    api_key: ""
    temperature: 0.3   # 解析类任务低温度，输出更稳定
  vision: # 智谱 GLM-4V-Flash（永久免费，图片解析）
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    model: "glm-4v-flash"
    api_key: ""
  embedding: # 硅基流动 BAAI/bge-m3（免费，https://cloud.siliconflow.cn 注册）
    base_url: "https://api.siliconflow.cn/v1"
    model: "BAAI/bge-m3"
    api_key: ""
    dim: 1024 # bge-m3 向量维度

# Prompt 库：以 Go 常量定义在 internal/prompt/prompts_*.go，按名取用，一个 Agent 可有多个变体

# Agent 定义表：新增 Agent 在此加配置即可（type 支持 parser / react）
# prompt 字段是"默认 Prompt 名"，Agent 运行时可按场景从 Prompt 库换用其他变体
agents:
  parser: # 条件解析 Agent（PRD 2.1）
    type: parser
    model: chat
    prompt: parser
  assistant: # 通用问答 ReAct Agent（示例：带岗位查询工具的推理循环）
    type: react
    model: chat
    prompt: assistant
    tools: ["query_positions"]
    max_steps: 5

# 执行流程编排：流程名 → 节点名列表（按序执行，上游输出作为下游输入）
flows:
  parse: ["parser"]
  # advise: ["parser", "researcher", "analyzer", "strategist", "responder"] # 后续迭代启用

# Agent 运行时参数
runtime:
  bus_buffer: 256   # 消息总线缓冲容量（背压阈值）
  node_inbox: 32    # 节点收件箱缓冲容量
  call_timeout: 30  # 节点调用超时（秒）

store:
  mysql: # 本地 Docker MySQL：用户信息、收藏等结构化业务数据
    dsn: "root:root123@tcp(127.0.0.1:3306)/kaogong?charset=utf8mb4&parseTime=True&loc=Local"
  postgres: # 本地 Docker pgvector：Agent 长期记忆 + RAG 知识库
    dsn: "postgres://postgres:root123@127.0.0.1:5432/kaogong?sslmode=disable"
  redis: # 本地 Docker Redis：通用缓存（预留给后续业务，当前无依赖）
    addr: "127.0.0.1:6379"
    password: ""
    db: 0
